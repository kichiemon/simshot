name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build universal binary (arm64 + x86_64)
        run: swift build -c release --disable-sandbox --arch arm64 --arch x86_64

      - name: Package single binaries (arm64 + x86_64 + tar.gz + sha256)
        run: |
          set -euo pipefail
          if [ -f .build/apple/Products/Release/simshot ]; then
            UNIVERSAL=.build/apple/Products/Release/simshot
          else
            UNIVERSAL=.build/release/simshot
          fi
          mkdir -p dist
          cp "$UNIVERSAL" dist/simshot-universal
          lipo -thin arm64 "$UNIVERSAL" -output dist/simshot-macos-arm64
          lipo -thin x86_64 "$UNIVERSAL" -output dist/simshot-macos-x86_64
          for arch in arm64 x86_64; do
            bin="dist/simshot-macos-${arch}"
            mkdir -p "dist/pkg-${arch}"
            cp "$bin" "dist/pkg-${arch}/simshot"
            tar -czf "dist/simshot-macos-${arch}.tar.gz" -C "dist/pkg-${arch}" simshot
            shasum -a 256 "$bin" > "dist/simshot-macos-${arch}.sha256"
            shasum -a 256 "dist/simshot-macos-${arch}.tar.gz" > "dist/simshot-macos-${arch}.tar.gz.sha256"
          done
          ls -l dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: simshot ${{ github.ref_name }}
          files: dist/simshot-macos-*
          generate_release_notes: true
