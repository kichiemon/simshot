name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: swift-format lint
        run: swift-format lint --recursive Sources Tests

      - name: Build
        run: swift build

      - name: Test
        run: swift test
